name: Test Barchart desde runner (temporal)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Probar sesion + un simbolo EOD
        run: |
          python - <<'EOF'
          import sys, urllib.parse, requests

          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/124.0 Safari/537.36")
          s = requests.Session()
          s.headers.update({"User-Agent": UA, "Accept": "application/json"})
          r = s.get("https://www.barchart.com/futures/quotes/GCZ26/overview", timeout=20)
          print(f"siembra cookies: HTTP {r.status_code}")
          tok = s.cookies.get("XSRF-TOKEN")
          print(f"token XSRF: {'SI' if tok else 'NO'}")
          if r.status_code != 200 or not tok:
              sys.exit(1)
          s.headers.update({"X-XSRF-TOKEN": urllib.parse.unquote(tok)})
          r = s.get("https://www.barchart.com/proxies/core-api/v1/historical/get",
                    params={"symbol": "GCZ26",
                            "fields": "tradeTime.format(Y-m-d),lastPrice,volume,openInterest",
                            "type": "eod", "startDate": "2026-07-13", "endDate": "2026-07-17",
                            "orderBy": "tradeTime", "orderDir": "asc"}, timeout=20)
          print(f"core-api: HTTP {r.status_code}")
          rows = r.json().get("data") or [] if r.status_code == 200 else []
          print(f"filas: {len(rows)}")
          for d in rows:
              print(f"  {d.get('tradeTime')} vol={d.get('volume')} oi={d.get('openInterest')}")
          sys.exit(0 if r.status_code == 200 and rows else 1)
          EOF
